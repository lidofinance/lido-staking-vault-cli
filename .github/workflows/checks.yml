name: Check all
on:
  pull_request:
jobs:
  check-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "yarn"

      - name: Install root dependencies
        run: yarn --immutable

      - name: Install test dependencies
        working-directory: tests/base
        run: yarn install --immutable

      - name: Check Lint
        run: yarn lint

      - name: Build
        run: yarn build
      - name: Check types
        run: yarn types

      - name: Tests
        run: yarn test
